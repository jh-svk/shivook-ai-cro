app = "shivook-ai-cro"
primary_region = "ams"

[build]

[env]
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "15s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
